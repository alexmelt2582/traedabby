name: Build & Verify Windows Setup

# 触发方式：
#   - 推 v* 标签（正式发版）
#   - 手动触发（workflow_dispatch，可选传版本号）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.0），留空则从 package.json 读取'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build Setup.exe + portable + verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./package.json').version")
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "detected version: $VER"

      - name: Build portable executable
        run: npm run build:exe

      - name: Package portable zip
        shell: pwsh
        # build:exe 已创建 dist/；便携 zip 落在 dist/ 根（dist/installer 要等 Inno Setup 才生成，故不能写到这里）
        run: tar -a -c -f "dist/TraeEnhancer-Portable-${{ steps.ver.outputs.version }}.zip" -C dist/portable .

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.3 --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed: $LASTEXITCODE" }

      - name: Build installer
        run: npm run build:installer

      - name: Verify artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          # 只断言两个目标产物存在；dist/ 根下 build-exe 的中间文件不参与比对
          $paths = @(
            "dist\installer\TraeEnhancer-Setup-$version.exe",
            "dist\TraeEnhancer-Portable-$version.zip"
          )
          foreach ($p in $paths) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) {
              throw "missing artifact: $p"
            }
          }
          echo "artifacts ok: $($paths -join ', ')"

      - name: List artifacts
        shell: bash
        run: ls -lh dist/ dist/installer/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-enhancer-win64
          path: |
            dist/installer/TraeEnhancer-Setup-*.exe
            dist/TraeEnhancer-Portable-*.zip

      # ------- 只有打 tag 时才挂到 GitHub Release -------
      - name: Prepare release notes (markdown, dynamic SHA256)
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $releaseDate = Get-Date -Format 'yyyy-MM-dd'
          $setup = "dist\installer\TraeEnhancer-Setup-$version.exe"
          $zip   = "dist\TraeEnhancer-Portable-$version.zip"
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLower()
          $zipHash   = (Get-FileHash -LiteralPath $zip   -Algorithm SHA256).Hash.ToLower()
          $md = @"
# TRAE SOLO CN 增强助手 v$version

发布日期：$releaseDate
发布类型：内部 / 小范围测试版
签名状态：未签名，Windows SmartScreen 可能提示未知发布者
发布分支：feature/device-identity（已合并 main）
代理功能：不包含；完整代理实现保留在 feature/proxy-support 分支，本发布包只使用直连网络。

## 本次更新
- 新增账号级设备身份：每个账号持有独立的一套 deviceId / machineId / 硬指纹 / EC 密钥对，被该账号的登录与刷新固定复用，规避官方"单设备可绑定账号数"触顶。
- 采纳 TRAE 现有账号时，复用其原本绑定的设备身份与密钥，避免因 deviceId 与密钥不配对触发 20403 校验错误。
- 安装器支持检测先前已安装版本：覆盖安装时提示保留账号数据与自启动偏好的选择。
- 修复 TRAE 未登录时的状态判定与账号同步时机，使新账号保存后立即同步签到、套餐与余额信息。

## 安装包
发布目录：dist\installer、dist

包含：

- TraeEnhancer-Setup-$version.exe
- TraeEnhancer-Portable-$version.zip

SHA256：

$setupHash  TraeEnhancer-Setup-$version.exe
$zipHash  TraeEnhancer-Portable-$version.zip

## 已知限制
- 安装包未签名，Windows SmartScreen 可能提示风险。
- 当前没有在线自动更新功能，升级需要覆盖运行新版安装包。
- 导入导出属于账号迁移，不是多设备共享。原设备继续更新登录信息后，副本可能失效并需要重新登录。
- 当前仅支持 Windows 10/11 x64 和 TRAE SOLO CN。
"@
          $md | Out-File -FilePath "dist\RELEASE_NOTES.md" -Encoding utf8
          "body=$md" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/TraeEnhancer-Setup-*.exe
            dist/TraeEnhancer-Portable-*.zip
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false