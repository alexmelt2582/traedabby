name: Build & Verify Windows Setup

# 触发方式：
#   - 推 v* 标签（正式发版）
#   - 手动触发（workflow_dispatch，可选传版本号）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.0），留空则从 package.json 读取'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build Setup.exe + portable + verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./package.json').version")
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "detected version: $VER"

      - name: Build portable executable
        run: npm run build:exe

      - name: Package portable zip
        shell: pwsh
        # build:exe 已创建 dist/；便携 zip 落在 dist/ 根（dist/installer 要等 Inno Setup 才生成，故不能写到这里）
        run: tar -a -c -f "dist/TraeEnhancer-Portable-${{ steps.ver.outputs.version }}.zip" -C dist/portable .

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.3 --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed: $LASTEXITCODE" }

      - name: Build installer
        run: npm run build:installer

      - name: Verify artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $expected = @(
            "TraeEnhancer-Setup-$version.exe",
            "TraeEnhancer-Portable-$version.zip"
          )
          $actual = @(
            @(Get-ChildItem -LiteralPath dist\installer -File | ForEach-Object Name),
            @(Get-ChildItem -LiteralPath dist -File | ForEach-Object Name)
          )
          $missing = Compare-Object $expected $actual
          if ($missing.Count -gt 0) {
            throw "artifacts mismatch, expected [$($expected -join ', ')], got [$($actual -join ', ')]"
          }
          echo "artifacts ok: $($actual -join ', ')"

      - name: List artifacts
        shell: bash
        run: ls -lh dist/ dist/installer/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-enhancer-win64
          path: |
            dist/installer/TraeEnhancer-Setup-*.exe
            dist/TraeEnhancer-Portable-*.zip

      # ------- 只有打 tag 时才挂到 GitHub Release -------
      - name: Prepare release body (tag subject)
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $subject = git -c core.pager=cat tag -l "v*" --format='%(contents:subject)' "$env:GITHUB_REF_NAME"
          "body=$subject" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/TraeEnhancer-Setup-*.exe
            dist/TraeEnhancer-Portable-*.zip
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false